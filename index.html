<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e9e9e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Enter Now">
<link rel="manifest" href="./manifest.json">
<title>Enter Now</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e9e9e7;color:#161616;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;touch-action:pan-y}
main{width:min(360px,calc(100% - 28px));margin:38px auto 30px;text-align:center}
h1{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:normal;margin:0 0 10px}
.mission{font-size:14px;line-height:1.45;margin:0 auto 26px;max-width:300px;color:#444}
.panel{border:1px solid #999;background:#f5f5f3;padding:18px 16px;margin-bottom:12px}
label{display:block;font-size:13px;margin-bottom:7px;color:#333}
select{width:100%;height:38px;border:1px solid #777;background:white;color:#111;padding:0 9px;font-size:15px;border-radius:2px}
.timer{font-family:'Courier New',monospace;font-size:32px;letter-spacing:1px;margin:4px 0 16px}
.count{font-size:13px;margin:0 0 15px;color:#444}
button{width:100%;height:42px;border:1px solid #555;border-radius:2px;background:#ddd;color:#111;font-size:15px;font-weight:bold;cursor:pointer}
button:active{background:#c8c8c8}
.start{background:#222;color:#fff;border-color:#222;margin-bottom:8px}
.play{margin-top:8px;background:#eee}
.status{font-size:12px;height:16px;margin-top:10px;color:#555}
.small{font-size:11px;color:#666;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>Enter Now</h1>
<p class="mission">A simple reminder to return your attention to the present moment.</p>

<section class="panel">
<label for="frequency">Reminders per hour</label>
<select id="frequency">
<option value="1">1 time per hour</option>
<option value="2">2 times per hour</option>
<option value="3" selected>3 times per hour</option>
<option value="4">4 times per hour</option>
<option value="5">5 times per hour</option>
</select>
</section>

<section class="panel">
<div class="timer" id="timer">00:00:00</div>
<div class="count">Cues: <strong id="count">0</strong></div>
<button class="start" id="start">Start Timer</button>
<button id="reset">Stop / Reset</button>
<button class="play" id="play">Play Sound</button>
<div class="status" id="status">Ready</div>
</section>

<div class="small">Enter Now · Presence practice</div>
</main>

<audio id="sound" preload="auto" src="./beep-boop.wav"></audio>

<script>
'use strict';
const timer=document.getElementById('timer');
const count=document.getElementById('count');
const frequency=document.getElementById('frequency');
const start=document.getElementById('start');
const reset=document.getElementById('reset');
const play=document.getElementById('play');
const status=document.getElementById('status');
const sound=document.getElementById('sound');

let running=false;
let startedAt=0;
let timerId=null;
let cueId=null;
let cues=0;

function format(ms){
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return [h,m,sec].map(v=>String(v).padStart(2,'0')).join(':');
}

function playSound(){
  sound.currentTime=0;
  sound.play().catch(()=>{});
}

function scheduleCue(){
  clearTimeout(cueId);
  if(!running)return;
  const perHour=Number(frequency.value);
  const interval=3600000/perHour;
  cueId=setTimeout(()=>{
    if(!running)return;
    cues++;
    count.textContent=cues;
    playSound();
    scheduleCue();
  },interval);
}

function updateTimer(){
  if(running)timer.textContent=format(Date.now()-startedAt);
}

start.addEventListener('click',()=>{
  if(running)return;
  running=true;
  startedAt=Date.now();
  cues=0;
  count.textContent='0';
  timer.textContent='00:00:00';
  status.textContent='Running';
  start.disabled=true;
  frequency.disabled=true;
  playSound();
  scheduleCue();
  timerId=setInterval(updateTimer,250);
});

reset.addEventListener('click',()=>{
  running=false;
  clearInterval(timerId);
  clearTimeout(cueId);
  timerId=null;
  cueId=null;
  cues=0;
  timer.textContent='00:00:00';
  count.textContent='0';
  status.textContent='Ready';
  start.disabled=false;
  frequency.disabled=false;
});

play.addEventListener('click',playSound);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
